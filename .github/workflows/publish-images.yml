name: Publish CMS images

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-cms-images-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  publish:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_URL: https://github.com/${{ github.repository }}

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: admin
          push: true
          tags: ghcr.io/ibrenos/nite-cms-admin:${{ env.TARGET_SHA }}
          labels: |
            org.opencontainers.image.source=${{ env.SOURCE_URL }}
            org.opencontainers.image.revision=${{ env.TARGET_SHA }}
          cache-from: type=gha,scope=nite-cms-admin
          cache-to: type=gha,mode=max,scope=nite-cms-admin

      - name: Build and publish API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: api
          push: true
          tags: ghcr.io/ibrenos/nite-cms-api:${{ env.TARGET_SHA }}
          labels: |
            org.opencontainers.image.source=${{ env.SOURCE_URL }}
            org.opencontainers.image.revision=${{ env.TARGET_SHA }}
          cache-from: type=gha,scope=nite-cms-api
          cache-to: type=gha,mode=max,scope=nite-cms-api

      - name: Build and publish Scheduler
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: scheduler
          push: true
          tags: ghcr.io/ibrenos/nite-cms-scheduler:${{ env.TARGET_SHA }}
          labels: |
            org.opencontainers.image.source=${{ env.SOURCE_URL }}
            org.opencontainers.image.revision=${{ env.TARGET_SHA }}
          cache-from: type=gha,scope=nite-cms-scheduler
          cache-to: type=gha,mode=max,scope=nite-cms-scheduler

      - name: Build and publish Migration
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: migration
          push: true
          tags: ghcr.io/ibrenos/nite-cms-migration:${{ env.TARGET_SHA }}
          labels: |
            org.opencontainers.image.source=${{ env.SOURCE_URL }}
            org.opencontainers.image.revision=${{ env.TARGET_SHA }}
          cache-from: type=gha,scope=nite-cms-migration
          cache-to: type=gha,mode=max,scope=nite-cms-migration
