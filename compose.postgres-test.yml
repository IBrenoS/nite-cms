name: nite-cms-test

services:
  postgres-test:
    image: postgres:16-alpine
    restart: "no"
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_DB: nite_cms_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute npm run env:setup na raiz do Portal}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nite_cms_test"]
      interval: 2s
      timeout: 3s
      retries: 20
